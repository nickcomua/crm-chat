[package]
name = "e2e-telegram"
version = "0.1.0"
edition = "2021"
description = "End-to-end integration tests for Telegram client (requires real credentials)"
license = "MIT"
publish = false

[dependencies]
hack = { path = "../../libs/hack", version = "0.1" }

[dev-dependencies]
messanger-interface = { path = "../../libs/messanger-interface" }
messanger-telegram = { path = "../../libs/messanger-telegram" }
secrecy = "0.10"
secretspec = { version = "0.8", default-features = false }
secretspec-derive = "0.8"
serde = { version = "1", features = ["derive"] }
serial_test = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
