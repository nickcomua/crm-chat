#:schema https://raw.githubusercontent.com/rust-lang/cargo/refs/heads/master/crates/cargo-util-schemas/manifest.schema.json
[workspace]
members = [
  "bins/convex-backend",
  "libs/hack",
  "libs/messanger-interface",
  "libs/messanger-telegram",
  "bins/crm-worker",
  "tests/e2e-telegram",
]
exclude = [
  "libs/convex-typegen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.metadata.crane]
name = "crm-chat"
