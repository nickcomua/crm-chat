name: "integration-tests"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["docker"]
    types:
      - completed

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: bins/crm-chat-web
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main  

      - uses: cachix/cachix-action@v16
        with:
          name: nickcomua
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Install dependencies
        run: nix develop --accept-flake-config --command bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: nix develop --accept-flake-config --command bun x playwright install chromium --with-deps

      - name: Run integration tests
        run: nix develop --accept-flake-config --command bun test
        env:
          TEST_BASE_URL: https://crm-chat.kaminazuma.com
          TEST_CLERK_USERNAME: ${{ secrets.TEST_CLERK_USERNAME }}
          TEST_CLERK_PASSWORD: ${{ secrets.TEST_CLERK_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: bins/crm-chat-web/playwright-report/
          retention-days: 30
