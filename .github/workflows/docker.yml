name: "docker"
on:
  push:
    branches:
      - "main"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            nix-system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            nix-system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: nick395
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: SebRollen/toml-action@v1.2.0
        id: read_version
        with:
          file: "Cargo.toml"
          field: "workspace.package.version"
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: nickcomua
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and push crm-worker (${{ matrix.arch }})
        run: |
          set -e
          VERSION_TAG="${{ steps.read_version.outputs.value }}-${{ github.run_number }}"
          nix build --accept-flake-config .#packages.${{ matrix.nix-system }}.crm-worker-img --print-build-logs
          docker load < ./result
          docker tag nick395/crm-worker:latest nick395/crm-worker:${VERSION_TAG}-${{ matrix.arch }}
          docker push nick395/crm-worker:${VERSION_TAG}-${{ matrix.arch }}

      - name: Build and push crm-chat-web (${{ matrix.arch }})
        run: |
          set -e
          VERSION_TAG="${{ steps.read_version.outputs.value }}-${{ github.run_number }}"
          nix build --accept-flake-config .#packages.${{ matrix.nix-system }}.crm-chat-web-img --print-build-logs
          docker load < ./result
          docker tag nick395/crm-chat-web:latest nick395/crm-chat-web:${VERSION_TAG}-${{ matrix.arch }}
          docker push nick395/crm-chat-web:${VERSION_TAG}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: nick395
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: SebRollen/toml-action@v1.2.0
        id: read_version
        with:
          file: "Cargo.toml"
          field: "workspace.package.version"

      - name: Create and push multi-arch manifests
        run: |
          set -e
          VERSION_TAG="${{ steps.read_version.outputs.value }}-${{ github.run_number }}"

          for IMAGE in crm-worker crm-chat-web; do
            docker manifest create --amend nick395/${IMAGE}:latest \
              nick395/${IMAGE}:${VERSION_TAG}-amd64 \
              nick395/${IMAGE}:${VERSION_TAG}-arm64
            docker manifest create --amend nick395/${IMAGE}:${VERSION_TAG} \
              nick395/${IMAGE}:${VERSION_TAG}-amd64 \
              nick395/${IMAGE}:${VERSION_TAG}-arm64

            docker manifest push nick395/${IMAGE}:latest
            docker manifest push nick395/${IMAGE}:${VERSION_TAG}
          done
