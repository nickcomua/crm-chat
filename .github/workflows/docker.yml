name: "docker"
on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - uses: actions/checkout@v5
      # - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: docker/login-action@v3
        with:
          username: nick395
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: SebRollen/toml-action@v1.2.0
        id: read_version
        with:
          file: "Cargo.toml"
          field: "workspace.package.version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux
            extra-system-features = nixos-test benchmark big-parallel kvm
      # - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: cachix/cachix-action@v16
        with:
          name: nickcomua
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and push crm-worker (multi-arch)
        run: |
          set -e
          VERSION_TAG="${{ steps.read_version.outputs.value }}-${{ github.run_number }}"

          # Build x86_64-linux
          nix build --accept-flake-config .#packages.x86_64-linux.crm-worker-img --print-build-logs
          docker load < ./result
          docker tag nick395/crm-worker:latest nick395/crm-worker:${VERSION_TAG}-amd64
          docker push nick395/crm-worker:${VERSION_TAG}-amd64

          # Build aarch64-linux
          nix build --accept-flake-config .#packages.aarch64-linux.crm-worker-img --print-build-logs
          docker load < ./result
          docker tag nick395/crm-worker:latest nick395/crm-worker:${VERSION_TAG}-arm64
          docker push nick395/crm-worker:${VERSION_TAG}-arm64

          # Create and push manifest
          docker manifest create --amend nick395/crm-worker:latest \
            nick395/crm-worker:${VERSION_TAG}-amd64 \
            nick395/crm-worker:${VERSION_TAG}-arm64
          docker manifest create --amend nick395/crm-worker:${VERSION_TAG} \
            nick395/crm-worker:${VERSION_TAG}-amd64 \
            nick395/crm-worker:${VERSION_TAG}-arm64

          docker manifest push nick395/crm-worker:latest
          docker manifest push nick395/crm-worker:${VERSION_TAG}

      - name: Build and push crm-chat-web (multi-arch)
        run: |
          set -e
          VERSION_TAG="${{ steps.read_version.outputs.value }}-${{ github.run_number }}"

          # Build x86_64-linux
          nix build --accept-flake-config .#packages.x86_64-linux.crm-chat-web-img --print-build-logs
          docker load < ./result
          docker tag nick395/crm-chat-web:latest nick395/crm-chat-web:${VERSION_TAG}-amd64
          docker push nick395/crm-chat-web:${VERSION_TAG}-amd64

          # Build aarch64-linux
          nix build --accept-flake-config .#packages.aarch64-linux.crm-chat-web-img --print-build-logs
          docker load < ./result
          docker tag nick395/crm-chat-web:latest nick395/crm-chat-web:${VERSION_TAG}-arm64
          docker push nick395/crm-chat-web:${VERSION_TAG}-arm64

          # Create and push manifest
          docker manifest create --amend nick395/crm-chat-web:latest \
            nick395/crm-chat-web:${VERSION_TAG}-amd64 \
            nick395/crm-chat-web:${VERSION_TAG}-arm64
          docker manifest create --amend nick395/crm-chat-web:${VERSION_TAG} \
            nick395/crm-chat-web:${VERSION_TAG}-amd64 \
            nick395/crm-chat-web:${VERSION_TAG}-arm64

          docker manifest push nick395/crm-chat-web:latest
          docker manifest push nick395/crm-chat-web:${VERSION_TAG}
