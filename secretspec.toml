[project]
name = "crm-chat"
revision = "1.0"

# Provider selection stays in ~/.config/secretspec/config.toml. Do not commit
# BWS tokens, project IDs, or secret values.
#
# This workstation's user config selects profile "nixos" and defines a provider
# alias "bws", but it does not set [defaults] provider. `secretspec run` therefore
# uses profile nixos and does not contact BWS unless the command passes
# `--provider bws`. Profile nixos inherits default, so both names resolve the
# same declarations. BWS stores flat key names; the profile does not rename them.

[profiles.default]
CACHIX_AUTH_TOKEN = { description = "Write access to the nickcomua binary cache", required = false }
TG_ID = { description = "Telegram application API ID. Legacy worker key. Runtime only; never a Vite variable.", required = true }
TG_HASH = { description = "Telegram application API hash. Legacy worker key. Runtime only; never a Vite variable.", required = true }
TG_API_ID_1 = { description = "Telegram API ID for integration-test account 1", required = false }
TG_API_HASH_1 = { description = "Telegram API hash for integration-test account 1", required = false }
TG_SESSION_FILE_1 = { description = "Session file for integration-test account 1", required = false }
TG_USER_ID_1 = { description = "Telegram user id for integration-test account 1", required = false }
TG_API_ID_2 = { description = "Telegram API ID for integration-test account 2", required = false }
TG_API_HASH_2 = { description = "Telegram API hash for integration-test account 2", required = false }
TG_SESSION_FILE_2 = { description = "Session file for integration-test account 2. Legacy. The login command does not read or change it.", required = false }
TG_SESSION_GRAMMERS_1 = { description = "grammers SqliteSession for integration-test account 1, base64. Written only by the login command.", required = false }
TG_USER_NUMERIC_ID_1 = { description = "Numeric Telegram user id for integration-test account 1. Written only by the login command.", required = false }
TG_SESSION_GRAMMERS_2 = { description = "grammers SqliteSession for integration-test account 2, base64. Written only by the login command.", required = false }
TG_USER_NUMERIC_ID_2 = { description = "Numeric Telegram user id for integration-test account 2. Written only by the login command.", required = false }

[profiles.nixos.defaults]
inherit = true

[scopes.app]
secrets = ["TG_ID", "TG_HASH"]

[scopes.integration]
secrets = [
  "TG_ID",
  "TG_HASH",
  "TG_API_ID_1",
  "TG_USER_ID_1",
  "TG_API_ID_2",
  "TG_USER_NUMERIC_ID_1",
  "TG_USER_NUMERIC_ID_2",
]
