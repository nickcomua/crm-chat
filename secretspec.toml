[project]
name = "crm-chat"
revision = "1.0"

# Provider selection and credentials are user-local in
# ~/.config/secretspec/config.toml. Do not commit BWS tokens or project IDs.
# The boot shells do not need application secrets yet. The only declaration
# is the optional cache credential used by developer/CI tooling.
[profiles.default]
CACHIX_AUTH_TOKEN = { description = "Write access to the nickcomua binary cache", required = false }
