[project]
name = "crm-chat"
revision = "1.0"

# ─── Service profiles ───────────────────────────────────────────────

[profiles.crm_worker]
# Secrets
TG_ID = { description = "Telegram API ID", required = true }
TG_HASH = { description = "Telegram API hash", required = true }
CLERK_M2M_SECRET_KEY = { description = "Clerk machine-to-machine secret key for worker auth", required = true }
SENTRY_URL = { description = "Sentry DSN for backend error tracking", required = false }
# Infrastructure / config
CONVEX_URL = { description = "Convex backend URL for Rust worker SDK", required = true }
TG_SESSION_DIR = { description = "Telegram session directory", required = false, default = "./target/crm-worker-data" }
MAX_MEDIA_WORKFLOWS = { description = "Max parallel media downloads (0=unlimited)", required = false, default = "2" }
SCAN_REFRESH_SECS = { description = "Seconds between scan-enabled-chats refresh", required = false, default = "60" }

[profiles.convex_backend]
CLERK_JWT_ISSUER_DOMAIN = { description = "Clerk JWT issuer domain for auth config", required = true }
CLERK_SECRET_KEY = { description = "Clerk secret key (for agent/tooling interaction)", required = false }
CONVEX_SELF_HOSTED_URL = { description = "Self-hosted Convex backend URL for CLI", required = true }

[profiles.crm_chat_web]
VITE_CLERK_PUBLISHABLE_KEY = { description = "Clerk publishable key for frontend auth", required = false }
VITE_CONVEX_URL = { description = "Convex backend URL for frontend client", required = true }
VITE_ES_PROXY_URL = { description = "Elasticsearch proxy URL", required = false }
VITE_SENTRY_DSN = { description = "Sentry DSN for frontend error tracking", required = false }
VITE_SENTRY_ENVIRONMENT = { description = "Sentry environment tag", required = false, default = "development" }
VITE_TEST_USERNAME = { description = "Test user credentials for auto-sign-in", required = false }
VITE_TEST_PASSWORD = { description = "Test user password for auto-sign-in", required = false }

# ─── Test profiles ───────────────────────────────────────────────────

[profiles.e2e_telegram]
# All optional -- tests skip gracefully when missing
TG_API_ID_1 = { description = "Telegram API ID for account 1", required = false }
TG_API_HASH_1 = { description = "Telegram API hash for account 1", required = false }
TG_SESSION_FILE_1 = { description = "Telegram session file path for account 1", required = false }
TG_API_ID_2 = { description = "Telegram API ID for account 2", required = false }
TG_API_HASH_2 = { description = "Telegram API hash for account 2", required = false }
TG_SESSION_FILE_2 = { description = "Telegram session file path for account 2", required = false }

[profiles.e2e_web]
TEST_CLERK_USERNAME = { description = "Clerk test user email for E2E login", required = true }
TEST_CLERK_PASSWORD = { description = "Clerk test user password for E2E login", required = true }
VITE_CLERK_PUBLISHABLE_KEY = { description = "Clerk publishable key for frontend auth", required = true }
CLERK_JWT_ISSUER_DOMAIN = { description = "Clerk JWT issuer domain for auth config", required = true }
CLERK_M2M_SECRET_KEY = { description = "Clerk machine-to-machine secret key for worker auth", required = true }
TG_ID = { description = "Telegram API ID", required = true }
TG_HASH = { description = "Telegram API hash", required = true }
TG_SESSION_FILE_1 = { description = "Telegram session file path for account 1", required = true }
TG_USER_ID_1 = { description = "Telegram user ID for account 1", required = true }

[profiles.convex_backend_test]
CLERK_M2M_SECRET_KEY = { description = "Clerk machine-to-machine secret key for worker auth", required = true }
CLERK_JWT_ISSUER_DOMAIN = { description = "Clerk JWT issuer domain for auth config", required = true }

# ─── Infrastructure / CI profiles ────────────────────────────────────

[profiles.deploy]
DOCKER_USER = { description = "Docker Hub username for image push", required = true }
DOCKER_TOKEN = { description = "Docker Hub access token for image push", required = true }
DOKPLOY_URL = { description = "Dokploy dashboard URL", required = false, default = "https://dokploy.kaminazuma.com" }
DOKPLOY_API_KEY = { description = "Dokploy API key for deployment trigger", required = true }
DOKPLOY_WEB_APP_ID = { description = "Dokploy application ID for web app", required = true }
DOKPLOY_SUBSCRIBER_APP_ID = { description = "Dokploy application ID for telegram subscriber", required = false }

[profiles.ci]
CACHIX_AUTH_TOKEN = { description = "Cachix auth token for binary cache", required = false }
DOCKERHUB_TOKEN = { description = "Docker Hub access token", required = false }
GH_TOKEN = { description = "GitHub personal access token", required = false }
SENTRY_PERSONAL_TOKEN = { description = "Sentry personal auth token", required = false }
