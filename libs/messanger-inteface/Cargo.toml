[package]
name = "messanger-inteface"
version = "0.1.0"
edition = "2021"
description = "Universal messenger client interface abstractions for CRM chat ingestion."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
erased-serde = "0.4"
futures = "0.3"
hack = { version = "0.1", path = "../hack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = "0.1"

[dev-dependencies]
serde_json = "1"
