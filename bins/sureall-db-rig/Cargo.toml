[package]
name = "sureall-db-rig"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = { git = "https://github.com/0xPlaygrounds/rig.git", features = ["derive"]}
rig-surrealdb = { git = "https://github.com/0xPlaygrounds/rig.git" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
surrealdb = "2.3.10"
anyhow = "1.0.100"

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
