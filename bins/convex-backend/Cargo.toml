[package]
name = "convex-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generated Rust type bindings from Convex schema"

[dependencies]
anyhow = "1"
convex = "0.10.2"
futures-core = "0.3"
serde = { version = ">=1, <1.0.224", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
testcontainers = "0.27"
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
futures = "0.3"

[build-dependencies]
convex-typegen = { path = "../../../convex-typegen" }
