[package]
name = "convex-backend"
version = "0.1.0"
edition = "2024"
description = "Generated Rust type bindings from Convex schema"
license = "MIT"

[dependencies]
anyhow = "1"
convex = "0.10.2"
futures-core = "0.3"
hack = { path = "../../libs/hack", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
convex-typegen = { git = "https://github.com/nickcomua/convex-typegen.git" }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
secrecy = "0.10"
tempfile = "3"
testcontainers = "0.27"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
convex-typegen = { git = "https://github.com/nickcomua/convex-typegen.git" }
