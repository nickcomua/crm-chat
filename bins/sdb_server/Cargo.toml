[package]
name = "sdb_server"
version = "0.1.1"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
log = "0.4"
phonelib = "1.0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
spacetimedb = { version = "=1.10.0" }
