[package]
name = "emmbedig-calculator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-openai = { version = '0.30.1' }
base64 = "0.22.1"
dotenv = "0.15.0"
futures = "0.3.31"
qdrant-client = "1.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
surrealdb = "2.3.10"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
# grammers-tl-types = { git = "https://github.com/Lonami/grammers", features = ["impl-serde"]}
tonic = "0.14.2"
# surql-definition-macros = "0.2.1"
[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
