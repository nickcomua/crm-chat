[package]
name = "telegram-subscriber"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "b595a8c4fdfa5c3a8abcb5766c959ecfe30e9f6e" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "b595a8c4fdfa5c3a8abcb5766c959ecfe30e9f6e" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "b595a8c4fdfa5c3a8abcb5766c959ecfe30e9f6e" }
hack = { version = "0.1", path = "../../libs/hack" }
jsonwebtoken = "9.3"
messanger-telegram = { path = "../../libs/messanger-telegram" }
reqwest = { version = "0.12", features = ["json"] }
sdb_api = { path = "../../libs/sdb_api" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
spacetimedb-sdk = "1.10.*"
tokio = { version = "1.49.0", features = ["full", "macros", "rt-multi-thread"] }
