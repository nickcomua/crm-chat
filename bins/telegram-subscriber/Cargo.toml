[package]
name = "telegram-subscriber"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hack = { version = "0.1", path = "../../libs/hack" }
jsonwebtoken = "9.3"
messanger-telegram = { path = "../../libs/messanger-telegram" }
messanger-interface= { path = "../../libs/messanger-interface" }
reqwest = { version = "0.12", features = ["json"] }
sdb_api = { path = "../../libs/sdb_api" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
spacetimedb-sdk = "1.10.*"
tokio = { version = "1.49.0", features = ["full", "macros", "rt-multi-thread"] }
futures = "0.3.*"
tokio-util = "0.7.18"
