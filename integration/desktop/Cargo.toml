[package]
name = "crm-chat-integration-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# `shape` is offline and runs in `nix flake check`. `credentials` and `account`
# open Telegram and stay in `nix run .#integration-test`.

[dependencies]
crm-chat-telegram = { path = "../../crates/telegram" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
