[package]
name = "crm-chat-integration-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# Not a workspace member of the repo root. `nix flake check` must not open a
# Telegram connection. `nix run .#integration-test` builds this binary.

[dependencies]
crm-chat-telegram = { path = "../../crates/telegram" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
