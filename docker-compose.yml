services:
  restate:
    image: docker.io/restatedev/restate:1.3
    ports:
      - "${RESTATE_INGRESS_PORT:-8080}:8080"
      - "${RESTATE_ADMIN_PORT:-9070}:9070"
    volumes:
      - restate-data:/target
    environment:
      - RESTATE_OBSERVABILITY__LOG__FORMAT=json

  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - /Volumes/Untitled/crm-chat_data-2:/convex/data
    environment:
      # - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_CLOUD_ORIGIN=http://backend.crm-chat.orb.local
      # - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - CONVEX_SITE_ORIGIN=http://backend.crm-chat.orb.local:3211
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - RUST_LOG=${RUST_LOG:-info}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      # - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_DEPLOYMENT_URL=https://backend.crm-chat.orb.local
      - NEXT_PUBLIC_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

