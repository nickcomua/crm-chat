services:
  restate:
    image: docker.restate.dev/restatedev/restate:latest
    # image: docker.io/restatedev/restate:1.6
    ports:
      - 8080:8080
      - 9070:9070
      - 9071:9071
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./target/restate-data:/restate-data
    environment:
      - RESTATE_NODE_NAME=crm-restate
      - RESTATE_OBSERVABILITY__LOG__FORMAT=json
      # Long-running handlers (TaskOrchestrator, UpdateListener) run subscription
      # loops that may be idle for extended periods between events.
      - RESTATE_WORKER__INVOKER__INACTIVITY_TIMEOUT=24h
      - RESTATE_WORKER__INVOKER__ABORT_TIMEOUT=25h
      # Optional: send Restate traces to Sentry via OTEL ingest
      - RESTATE_OBSERVABILITY__TRACING__ENDPOINT=${SENTRY_OTEL_ENDPOINT:-}
      - RESTATE_OBSERVABILITY__TRACING__HEADERS=${SENTRY_OTEL_HEADERS:-}
    healthcheck:
      test: curl -f http://localhost:8080/restate/health
      interval: 5s
      start_period: 10s

  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - ./target/crm-chat-data:/convex/data
    environment:
      # - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_CLOUD_ORIGIN=http://localhost:3210
      # - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - CONVEX_SITE_ORIGIN=http://localhost:3210
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - RUST_LOG=${RUST_LOG:-info}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      # - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://localhost:3210
      - NEXT_PUBLIC_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

  crm-worker:
    image: nick395/crm-worker:latest
    environment:
      - TG_ID=${TG_ID}
      - TG_HASH=${TG_HASH}
      - CONVEX_URL=${CONVEX_URL:-http://backend:3210}
      - ROBOT_ID=${ROBOT_ID}
      - ROBOT_KID=${ROBOT_KID}
      - ROBOT_JWT_PRIVATE_KEY=${ROBOT_JWT_PRIVATE_KEY}
      - RESTATE_ADMIN_URL=http://restate:9070
      - RESTATE_INGRESS_URL=http://restate:8080
      - RESTATE_SERVICE_URL=http://crm-worker:9080
      - MAX_MEDIA_WORKFLOWS=${MAX_MEDIA_WORKFLOWS:-2}
      - SENTRY_URL=${SENTRY_URL:-}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      restate:
        condition: service_healthy
      backend:
        condition: service_healthy

  web:
    image: nick395/crm-chat-web:latest
    environment:
      - VITE_CONVEX_URL=${VITE_CONVEX_URL:-localhost:${PORT:-3210}}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
      - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    depends_on:
      backend:
        condition: service_healthy