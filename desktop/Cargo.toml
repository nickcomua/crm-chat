[package]
name = "crm-chat-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "crm_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep the `devtools` feature off so release builds cannot open the web inspector.
tauri = { version = "2", features = [] }
crm-chat-telegram = { path = "../crates/telegram" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
